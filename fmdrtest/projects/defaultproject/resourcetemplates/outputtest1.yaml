apiVersion: eaas.envmgmt.io/v1
kind: ResourceTemplate
metadata:
  name: outputtest1
  project: defaultproject
spec:
  provider: terraform
  providerOptions:
    terraform:
      backendType: system
      refresh: true
  repositoryOptions:
    branch: main
    directoryPath: outputtest
    name: system-sync
  variables:
  - name: name
    options:
      displayMetadata: {}
      override:
        type: allowed
      required: true
    value: test
    valueType: text
  version: v2
  versionState: draft
