apiVersion: v1
data:
  index.html: |
    <html>
    <body>
    <h1>Hi {{ .Values.User.name }},</h1>
    <h2> Welcome to Rafay kubernets troubleshooting session!! </h2>
    <h2> You have successfulky deployed your sample web application!! </h2>  
    </body>
    </html>
kind: ConfigMap
metadata:
  name: index-cm
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-nginx-conf
data:
  default.conf: |
    server {
      listen {{ .Values.deployment.port }};

      location = /{{ .Values.User.name }} {
        return 301 /{{ .Values.User.name }}/;
      }

      location /{{ .Values.User.name }}/ {
        alias /usr/share/nginx/html/;
        index index.html;
      }

      location / {
        root /usr/share/nginx/html;
        index index.html;
      }
    }
