User:
  name: cherry

replicaCount: 2

image:
  repository: nginx:latest

labels:
  app: web-app
  type: frontend

serviceAccount:
  enabled: true
  name: demo-sa

service:
  annotations:
    envlabel: test
  protocol: TCP
  type: ClusterIP 
  port: 80
  labels:
    name: webapp-service

deployment:
  port: 80

ingress:
  enabled: true
  className: alb
  annotations: {}
  path: /cherry
  pathType: Prefix
    # alb.ingress.kubernetes.io/subnets: subnet-aaa,subnet-bbb
    # alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:...
